# Input file for model training
# Default parameters here are the optimized hyperparameters reported in the paper

nGraphConvolutionLayers: 5 # Number of graph convolutional layers
nNodeNeurons: 257 # Number of node neurons for GNN
nEdgeNeurons: 291 # Number of edge neurons for GNN
dropoutGNN: 0.0898 # Dropout in graph convolutional layers
momentumBatchNorm: 0.3378 # Batch normalization in graph convolutional layers

nSharedLayers: 1 # Number of layers in shared core
nTargetSpecificLayers: 2 # Number of layers in target specific core
nShared: [128] # Number of neurons in shared core
nTarget: [183,149] # Number of neurons in target specific core
dropoutShared: [0.1629] # Dropout in shared core
dropoutTarget: [0.3468,0.3632] # Dropout in target specific core

# Weights for weighted cost function
w1: 1.004 
w2: 3.590 
w3: 2.246 
w4: 1.121
w5: 1.137 

# Activation function
ActivationFunction: 'Tanh'

nEpochs: 200 # Number of epochs
nBatch: 32 # Batch size
nCheckpoint: 1 # Checkpoint frequency
randomSeed: 42 # Random seed
#nTrainMaxEntries: 1500 # Number of training samples to use, if you want to use a subset of the full train set 
#nValMaxEntries: 300 # Number of validation examples to  use, if you want to use a subset of the full val set

learningRate: 0.000059 #0.00027 #0.0001 

weightedCostFunction: True # Include weighted cost function
L2Regularization: 0.005 # L2 regularization coefficient

# inputMode options: "gnn" (default), "descriptor", "combined"
# "gnn": graph features only (GINEConv)
# "descriptor": Mordred 2D descriptors only (requires data_file with descriptor columns)
# "combined": GNN graph embedding concatenated with descriptor vector
inputMode: "gnn"

callbacks: 
   earlyStopping:
      patience: 10 #1000
      min_delta: 1.0e-5 #5e-4
   LRScheduler:
      patience: 1
      min_lr: 1.0e-8
      factor: 0.1
   UserStopping:

descriptionText: 'No data transformation'

# where the graph data-base resides
database: '/AMES_GNN_MTL_Network/GraphDataBase_AMES/'

# file with molecular data
data_file: '/AMES_GNN_MTL_Network/AMES_FINAL/Ames_mutagenicity_strain_specific.csv'

# transformData: std

