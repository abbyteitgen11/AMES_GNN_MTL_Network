
# Input file for model training

nGraphConvolutionLayers: 4 #5 # Number of graph convolutional layers
nNodeNeurons: 195 #78 #77 # Number of node neurons for GNN
nEdgeNeurons: 14 #109 #184 # Number of edge neurons for GNN
dropoutGNN: 0.0609 #0.0176 #0.0503 # Dropout in graph convolutional layers
momentumBatchNorm: 0.3700 #0.6003 #0.6806 # Batch normalization in graph convolutional layers

nSharedLayers: 1 #2 #2  # Number of layers in shared core
nTargetSpecificLayers: 2 #2 #1 # Number of layers in target specific core
nShared: [92] # [167, 108] #[101,93] # Number of neurons in shared core
nTarget: [118,170] #[96, 104] #[218] # Number of neurons in target specific core
dropoutShared: [0.1622] #[0.074, 0.240] #[0.272, 0.253] # Dropout in shared core
dropoutTarget: [0.0536,0.4618] #[0.463, 0.065] #[0.261] # Dropout in target specific core

# Weights for weighted cost function
w1: 4.7066 #5.88 #4.99
w2: 2.7213 #5.67 #4.08
w3: 2.0795 #1.57 #1.55
w4: 1.0101 #1.02 #52.96
w5: 3.3616 #2.16 #2.94

# Activation function
ActivationFunction: 'Tanh'

nEpochs: 200 #np.iinfo(np.int32). # Number of epochs
nBatch: 32 # Batch size
nCheckpoint: 1 # Checkpoint frequency
randomSeed: 42 # Random seed
#nTrainMaxEntries: 1500 # Number of training samples to use
#nValMaxEntries: 300 # Number of validation examples to  use

learningRate: 0.000076 #0.00027 #0.0001 

weightedCostFunction: True # Include weighted cost function
L2Regularization: 0.005 # L2 regularization coefficient

# inputMode options: "gnn" (default), "descriptor", "combined"
# "gnn": graph features only (GINEConv)
# "descriptor": Mordred 2D descriptors only (requires data_file with descriptor columns)
# "combined": GNN graph embedding concatenated with descriptor vector
inputMode: "gnn"

callbacks: 
   earlyStopping:
      patience: 10 #1000
      min_delta: 1.0e-5 #5e-4
   LRScheduler:
      patience: 1
      min_lr: 1.0e-8
      factor: 0.1
   UserStopping:

descriptionText: 'No data transformation'

# where the graph data-base resides
database: '/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/GraphDataBase_AMES_NEW_RBF_2D/' #'/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/GraphDataBase_AMES_NEW/' #'/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/GraphDataBase_AMES_additional_data' 

# file with molecular data
data_file: '/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/AMES_FINAL/data/data_new_with_split_descriptors.csv' #data_new_with_split_descriptors.csv' #'/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/AMES_FINAL/data/data_new_with_split_descriptors.csv' #'/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/Additional_data/final_additional_dataset.csv' 

