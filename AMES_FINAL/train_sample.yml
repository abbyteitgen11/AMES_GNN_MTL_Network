
# Input file for model training

nGraphConvolutionLayers: 5 # Number of graph convolutional layers
nNodeNeurons: 77 # Number of node neurons for GNN
nEdgeNeurons: 184 # Number of edge neurons for GNN
dropoutGNN: 0.0503 # Dropout in graph convolutional layers
momentumBatchNorm: 0.6806 # Batch normalization in graph convolutional layers

nSharedLayers: 2  # Number of layers in shared core
nTargetSpecificLayers: 1 # Number of layers in target specific core
nShared: [101,93] # Number of neurons in shared core
nTarget: [218] # Number of neurons in target specific core
dropoutShared: [0.272, 0.253] # Dropout in shared core
dropoutTarget: [0.261] # Dropout in target specific core

# Weights for weighted cost function
w1: 4.99
w2: 4.08
w3: 1.55
w4: 2.96
w5: 2.94

# Activation function
ActivationFunction: "Tanh" #"Tanh"

nEpochs: 200 #np.iinfo(np.int32). # Number of epochs
nBatch: 32 # Batch size
nCheckpoint: 1 # Checkpoint frequency
randomSeed: 45 # Random seed
#nTrainMaxEntries: 1500 # Number of training samples to use
#nValMaxEntries: 300 # Number of validation examples to  use

learningRate: 0.0001 #0.0000924993113995373 #0.0001 #5e-4

weightedCostFunction: True # Include weighted cost function
L2Regularization: 0.005 # L2 regularization coefficient

# inputMode options: "gnn" (default), "descriptor", "combined"
# "gnn": graph features only (GINEConv)
# "descriptor": Mordred 2D descriptors only (requires data_file with descriptor columns)
# "combined": GNN graph embedding concatenated with descriptor vector
inputMode: "combined"

callbacks: 
   earlyStopping:
      patience: 10 #1000
      min_delta: 1.0e-5 #5e-4
   LRScheduler:
      patience: 1
      min_lr: 1.0e-8
      factor: 0.1
   UserStopping:

descriptionText: 'No data transformation'

# where the graph data-base resides
database: '/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/GraphDataBase_AMES_NEW/' #'/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/GraphDataBase_AMES_additional_data' 

# file with molecular data
data_file: '/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/AMES_FINAL/data/data_new_with_split_descriptors.csv' #'/Users/abigailteitgen/Dropbox/Postdoc/AMES_GNN_MTL_Network/Additional_data/final_additional_dataset.csv' 

# transformData: std

