# a sample yaml input file, contains the defaults from the paper

# This input file specifies how graph objects are to be constructed; it reads information
# for defining node (atom) features and edge features.

# it is possible to avoid generating the graph objects (usually for debug purposes);
# in that case, uncomment the following line.
generate_graphs: True

# the specific type of graph definition to be used 
graphType: 'XG' # currently this is the only graph type implemented

# address where to find the data-base files, and where to put the graph files once created
DataBaseDirectory: '/AMES_GNN_MTL_Network/XYZ_files'
TargetDirectory: '/AMES_GNN_MTL_Network/GraphDataBase_AMES'

# path to the CSV file used to determine train/val/test splits
DataPath: '/AMES_GNN_MTL_Network/AMES_FINAL/data/Ames_mutagenicity_strain_specific.csv'

# the file extensions, both for the input and for the graph files

InputFileExtension: '.xyz'
OutputFileExtension: '.pkl'

nodeFeatures:   # the following are a list of mendeleev recognised keywords
   - 'atomic_number'
   - 'atomic_radius'
   - 'atomic_weight'
   - 'covalent_radius'
   - 'density'
   - 'en_pauling'
   - 'mass_number'
   - 'period'
   - 'vdw_radius'
   - 'block'
   - 'series'

# important note: first run counter.py to determine which species are present in the molecules and update the 
# section below. This is accurate for the dataset used in this paper.

species: ["N", "C", "H", "O", "S", "Cl", "Be", "Br", "Pt", "P", 
          "F", "As", "Hg", "Zn", "Si", "V", "I", "B", "Sn", "Ge", 
          "Ag", "Sb", "Cu", "Cr", "Pb", "Mo", "Se", "Al", "Cd", 
          "Mn", "Fe", "Ga", "Pd", "Na", "Ti", "Bi", "Co", "Ni", 
          "Ce", "Ba", "Zr", "Rh"]

nMaxNeighbours: 850 # Needs to be adjusted based on max number of atoms in molecules (depending on dataset)
# 850 is accurate for the dataset uesed in this paper

BondAngleFeatures: True

DihedralAngleFeatures: True

# Edge distance encoding: "raw" (default, single float) or "rbf" (Gaussian radial basis functions)
distanceEncoding: "rbf"

# RBF parameters (only used when distanceEncoding is "rbf")
# n_features: number of Gaussian basis functions
# r_min / r_max: range of distance centers (Angstroms)
# sigma: width of each Gaussian
RBFParameters:
  n_features: 20
  r_min: 0.0
  r_max: 5.0
  sigma: 0.5
